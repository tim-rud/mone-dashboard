<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Арт-Студия Моне — Панель Управления</title>
    <style>
        :root {
            --bg-dark: #0F172A; --bg-card: #1E293B; --text-main: #F8FAFC; --text-sec: #94A3B8;
            --vk-blue: #38BDF8; --color-plan: #34D399; --color-super: #FBBF24; --color-mega: #A855F7;
            --color-alert: #F87171; --space-bg: linear-gradient(135deg, #0F172A 0%, #090D16 100%);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--space-bg); color: var(--text-main); margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 16px; border: 1px solid #334155; position: relative; }
        .btn { background: var(--vk-blue); border: none; padding: 12px; border-radius: 8px; color: #000; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        .loader-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-dark); z-index: 999; display: flex; align-items: center; justify-content: center; }
        .modal-overlay { position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-box { background: var(--bg-card); padding: 25px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 5px 0 15px 0; border-radius: 8px; border: 1px solid #475569; background: #0F172A; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="loader-screen" class="loader-screen"><h2>Загрузка...</h2></div>

<div class="container">
    <h1>🎨 Арт-Студия Моне</h1>
    
    <div id="battle-arena" class="card" style="text-align:center; margin-bottom: 20px;">
        <h3>Битва за Мега-план</h3>
        <div id="lbl-team-status">Обновление данных...</div>
    </div>

    <div id="dashboard-grid" class="grid"></div>

    <button class="btn" onclick="showPrediction()" style="margin-top:30px; background:#475569; color:white;">Получить мотивацию</button>
</div>

<div class="modal-overlay" id="lk-modal" onclick="closeModal('lk-modal')">
    <div class="modal-box" onclick="event.stopPropagation()">
        <h3>Личный кабинет</h3>
        <input type="hidden" id="input-m-id">
        <input type="text" id="input-order" placeholder="Номер заказа">
        <input type="number" id="input-amount" placeholder="Сумма">
        <button class="btn" onclick="submitData()">Отправить заказ</button>
        <button class="btn" style="background:#64748B; color:white;" onclick="closeModal('lk-modal')">Закрыть</button>
    </div>
</div>

<div class="modal-overlay" id="predict-modal" onclick="closeModal('predict-modal')">
    <div class="modal-box" onclick="event.stopPropagation()">
        <h3>Предсказание дня</h3>
        <p id="predict-content" style="font-size: 1.2em; color: var(--vk-blue); margin: 20px 0;"></p>
        <button class="btn" onclick="closeModal('predict-modal')">Понял!</button>
    </div>
</div>

<script>
    // --- 1. ВСТАВЬ СЮДА СВОЮ ССЫЛКУ ---
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXXjSLoclGShalILv99JPSMFTuuXHNVnWaZ2HUIdYRUnL11PGMHqnF461BTzIFRj57qw/exec";
    const predictions = ["Сегодня твой день!", "Средний чек взлетит!", "Клиенты будут в восторге", "Ты — топ менеджер!", "Удача на твоей стороне"];

    async function loadDataFromGoogle() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            renderUI(data);
        } catch(e) { console.error("Ошибка:", e); }
    }

    function renderUI(data) {
        const grid = document.getElementById('dashboard-grid');
        grid.innerHTML = '';
        
        let totalSales = 0;
        const managers = Object.values(data).sort((a, b) => b.sales - a.sales);

        managers.forEach((m, i) => {
            totalSales += m.sales;
            const medal = ['🥇 Лидер продаж', '🥈 Претендент', '🥉 На высоте'][i] || `${i+1} место`;
            
            grid.innerHTML += `
                <div class="card">
                    <h3>${m.id} ${m.isOnline ? '<span style="color:#34D399; font-size:0.7em;">● Online</span>' : ''}</h3>
                    <p style="color:var(--vk-blue); font-weight:bold;">${medal}</p>
                    <p>Выручка: <b>${m.sales.toLocaleString()} ₽</b></p>
                    <div style="background:#0F172A; height:8px; border-radius:4px; margin:10px 0;">
                        <div style="background:var(--vk-blue); width:${Math.min(100, (m.sales/m.mega)*100)}%; height:100%; border-radius:4px;"></div>
                    </div>
                    <button class="btn" onclick="openModal('${m.id}')">Добавить заказ</button>
                </div>
            `;
        });

        // Team Status
        document.getElementById('lbl-team-status').innerHTML = `Командная выручка: <b>${totalSales.toLocaleString()} ₽</b>`;
        document.getElementById('loader-screen').style.display = 'none';
        document.getElementById('dashboard-grid').style.display = 'grid';
    }

    function openModal(id) {
        document.getElementById('input-m-id').value = id;
        document.getElementById('lk-modal').style.display = 'flex';
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function showPrediction() {
        document.getElementById('predict-content').innerText = predictions[Math.floor(Math.random() * predictions.length)];
        document.getElementById('predict-modal').style.display = 'flex';
    }

    async function submitData() {
        const payload = {
            managerId: document.getElementById('input-m-id').value,
            orderId: document.getElementById('input-order').value,
            amount: parseInt(document.getElementById('input-amount').value),
            type: 'Sale'
        };
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        alert('Данные отправлены!');
        closeModal('lk-modal');
        loadDataFromGoogle();
    }

    setInterval(loadDataFromGoogle, 60000);
    loadDataFromGoogle();
</script>
</body>
</html>
