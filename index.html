<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд Моне — Панель Управления</title>
    <style>
        :root {
            --bg-dark: #0F172A;
            --bg-card: #1E293B;
            --text-main: #F8FAFC;
            --text-sec: #94A3B8;
            --vk-blue: #38BDF8;
            --color-plan: #34D399;
        }
        body { background: var(--bg-dark); color: var(--text-main); font-family: -apple-system, sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: var(--vk-blue); }
        
        /* Подиум */
        .podium { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; }
        .podium-item { background: var(--bg-card); padding: 15px; border-radius: 12px; text-align: center; width: 100px; border: 1px solid var(--vk-blue); }

        /* Сетка */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        .card h3 { margin-top: 0; display: flex; justify-content: space-between; }
        .online-dot { height: 10px; width: 10px; background: #34D399; border-radius: 50%; display: inline-block; }
        
        .progress-bg { background: #334155; height: 8px; border-radius: 4px; margin: 10px 0; }
        .progress-fill { background: var(--vk-blue); height: 100%; border-radius: 4px; transition: width 0.5s; }
        
        .btn { background: var(--vk-blue); border: none; padding: 10px; border-radius: 6px; cursor: pointer; color: white; width: 100%; font-weight: bold; }
        
        /* Модалка */
        .modal-overlay { position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; }
        .modal-box { background: var(--bg-card); padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: #334155; border: none; padding: 8px; color: white; cursor: pointer; border-radius: 4px; flex: 1; }
        .tab-btn.active { background: var(--vk-blue); }
        input, select { width: 100%; padding: 10px; margin: 5px 0 15px 0; border-radius: 6px; border: none; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎨 Арт-Студия Моне</h1>
    <div id="podium" class="podium"></div>
    <div id="grid" class="grid"></div>
</div>

<div class="modal-overlay" id="lk-modal">
    <div class="modal-box">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('sales')">Продажи</button>
            <button class="tab-btn" onclick="switchTab('schedule')">График</button>
        </div>
        
        <div id="tab-sales">
            <h3 id="modal-title">Добавить заказ</h3>
            <input type="hidden" id="input-m-id">
            <input type="text" id="input-order" placeholder="Номер заказа">
            <input type="number" id="input-amount" placeholder="Сумма">
            <button class="btn" onclick="submitData()">Отправить</button>
        </div>
        
        <div id="tab-schedule" style="display:none;">
            <h3>Мой график</h3>
            <p>Здесь отобразится информация о сменах.</p>
        </div>
        
        <button class="btn" style="background:#64748B; margin-top:20px;" onclick="closeModal()">Закрыть</button>
    </div>
</div>

<script>
    // 1. ВСТАВЬ СЮДА СВОЮ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXXjSLoclGShalILv99JPSMFTuuXHNVnWaZ2HUIdYRUnL11PGMHqnF461BTzIFRj57qw/exec";

    let globalData = {};

    async function loadData() {
        const response = await fetch(SCRIPT_URL);
        globalData = await response.json();
        renderDashboard(globalData);
    }

    function renderDashboard(data) {
        const grid = document.getElementById('grid');
        const podium = document.getElementById('podium');
        grid.innerHTML = '';
        podium.innerHTML = '';

        const managers = Object.values(data).sort((a, b) => b.sales - a.sales);

        // Рендер подиума
        managers.slice(0, 3).forEach((m, i) => {
            podium.innerHTML += `<div class="podium-item"><div>${i+1} место</div><b>${m.id}</b></div>`;
        });

        // Рендер карточек
        managers.forEach(m => {
            grid.innerHTML += `
                <div class="card">
                    <h3>${m.id} ${m.isOnline ? '<span class="online-dot"></span>' : ''}</h3>
                    <p>Выручка: <b>${m.sales.toLocaleString()} ₽</b></p>
                    <p>Средний чек: ${m.avgCheck.toLocaleString()} ₽</p>
                    <div class="progress-bg"><div class="progress-fill" style="width:${Math.min(100, (m.sales/m.mega)*100)}%"></div></div>
                    <button class="btn" onclick="openModal('${m.id}')">Личный кабинет</button>
                </div>
            `;
        });
    }

    function openModal(id) {
        document.getElementById('input-m-id').value = id;
        document.getElementById('modal-title').innerText = "Заказ для: " + id;
        document.getElementById('lk-modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('lk-modal').style.display = 'none'; }

    function switchTab(tab) {
        document.getElementById('tab-sales').style.display = tab === 'sales' ? 'block' : 'none';
        document.getElementById('tab-schedule').style.display = tab === 'schedule' ? 'block' : 'none';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active'));
    }

    async function submitData() {
        const payload = {
            managerId: document.getElementById('input-m-id').value,
            orderId: document.getElementById('input-order').value,
            amount: parseInt(document.getElementById('input-amount').value),
            type: 'Sale'
        };
        
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        alert('Данные отправлены!');
        closeModal();
        loadData(); // Обновляем экран
    }

    // Автообновление раз в минуту
    setInterval(loadData, 60000);
    loadData();
</script>
</body>
</html>
