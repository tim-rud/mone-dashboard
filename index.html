<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Дашборд Моне</title>
    <style>
        :root { --bg: #0F172A; --card: #1E293B; --text: #F8FAFC; --accent: #38BDF8; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; position: relative; }
        .podium { font-size: 1.5em; margin-bottom: 20px; text-align: center; color: var(--accent); }
        .online-dot { height: 10px; width: 10px; background: #34D399; border-radius: 50%; display: inline-block; }
        .btn { background: var(--accent); border: none; padding: 10px; border-radius: 6px; cursor: pointer; color: white; width: 100%; margin-top: 10px; }
        .modal { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: var(--card); padding: 30px; border-radius: 12px; width: 300px; }
        input, select { width: 100%; padding: 8px; margin: 10px 0; border-radius: 4px; border: none; }
    </style>
</head>
<body>

    <h1 style="text-align:center;">Арт-Студия Моне</h1>
    <div id="podium" class="podium"></div>
    <div id="grid" class="grid"></div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h3>Новый заказ</h3>
            <select id="m-select"></select>
            <input type="text" id="order-id" placeholder="Номер заказа">
            <input type="number" id="amount" placeholder="Сумма">
            <button class="btn" onclick="sendData()">Отправить</button>
            <button class="btn" style="background:#64748B" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXXjSLoclGShalILv99JPSMFTuuXHNVnWaZ2HUIdYRUnL11PGMHqnF461BTzIFRj57qw/exec";

        async function loadData() {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            render(data);
        }

        function render(data) {
            const grid = document.getElementById('grid');
            const select = document.getElementById('m-select');
            grid.innerHTML = '';
            select.innerHTML = '';

            const sorted = Object.values(data).sort((a, b) => b.sales - a.sales);
            
            sorted.forEach((m, i) => {
                const online = m.isOnline ? '<span class="online-dot"></span> Online' : '';
                grid.innerHTML += `
                    <div class="card">
                        <h3>${i+1} место: ${m.id} ${online}</h3>
                        <p>Выручка: ${m.sales.toLocaleString()} ₽</p>
                        <p>Средний чек: ${m.avgCheck.toLocaleString()} ₽</p>
                        <div style="background:#334155; height:10px; border-radius:5px;">
                            <div style="background:var(--accent); width:${Math.min(100, (m.sales/m.mega)*100)}%; height:100%; border-radius:5px;"></div>
                        </div>
                        <button class="btn" onclick="openModal('${m.id}')">Добавить заказ</button>
                    </div>
                `;
                select.innerHTML += `<option value="${m.id}">${m.id}</option>`;
            });
        }

        function openModal(id) { 
            document.getElementById('m-select').value = id;
            document.getElementById('modal').style.display = 'flex'; 
        }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        async function sendData() {
            const payload = {
                managerId: document.getElementById('m-select').value,
                orderId: document.getElementById('order-id').value,
                amount: parseInt(document.getElementById('amount').value),
                type: 'Sale'
            };
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            closeModal();
            loadData();
        }

        setInterval(loadData, 60000); // Обновление раз в минуту
        loadData();
    </script>
</body>
</html>
