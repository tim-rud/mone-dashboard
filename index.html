<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Арт-Студия Моне — Панель Управления</title>

    <style>
        :root {
            --bg-dark: #0F172A;
            --bg-card: #1E293B;
            --text-main: #F8FAFC;
            --text-sec: #94A3B8;
            --vk-blue: #38BDF8;
            --color-plan: #34D399;
            --color-super: #FBBF24;
            --color-mega: #A855F7;
            --space-bg: linear-gradient(135deg, #0F172A 0%, #090D16 100%);
        }

        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--space-bg); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: var(--vk-blue); margin-bottom: 20px; }
        
        /* Сетка карточек */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--bg-card); padding: 20px; border-radius: 16px; border: 1px solid #334155; position: relative; }
        .card h3 { margin-top: 0; display: flex; justify-content: space-between; align-items: center; }
        
        /* Подиум */
        .podium { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .podium-item { background: var(--bg-card); padding: 10px 20px; border-radius: 12px; border: 1px solid var(--vk-blue); text-align: center; }

        /* Элементы */
        .online-dot { height: 10px; width: 10px; background: #34D399; border-radius: 50%; box-shadow: 0 0 8px #34D399; }
        .progress-bg { background: #0F172A; height: 10px; border-radius: 5px; margin: 15px 0; overflow: hidden; }
        .progress-fill { background: var(--vk-blue); height: 100%; border-radius: 5px; transition: width 0.5s; }
        .btn { background: var(--vk-blue); border: none; padding: 12px; border-radius: 8px; color: #000; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; }
        
        /* Модалки */
        .modal-overlay { position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-box { background: var(--bg-card); padding: 25px; border-radius: 16px; width: 90%; max-width: 400px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { background: #334155; border: none; padding: 10px; color: white; cursor: pointer; border-radius: 8px; flex: 1; }
        .tab-btn.active { background: var(--vk-blue); color: black; }
        input { width: 100%; padding: 12px; margin: 5px 0 15px 0; border-radius: 8px; border: 1px solid #475569; background: #0F172A; color: white; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎨 Арт-Студия Моне</h1>
    <div id="podium" class="podium"></div>
    <div id="grid" class="grid"></div>
</div>

<div class="modal-overlay" id="lk-modal">
    <div class="modal-box">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('sales')">Продажи</button>
            <button class="tab-btn" onclick="switchTab('schedule')">График</button>
        </div>
        
        <div id="tab-sales">
            <h3 id="modal-title">Добавить заказ</h3>
            <input type="hidden" id="input-m-id">
            <input type="text" id="input-order" placeholder="Номер заказа">
            <input type="number" id="input-amount" placeholder="Сумма">
            <button class="btn" onclick="submitData()">Отправить</button>
        </div>
        
        <div id="tab-schedule" style="display:none;">
            <h3>Мой график</h3>
            <p>Статус: Активен согласно таблице.</p>
        </div>
        
        <button class="btn" style="background:#64748B; color:white;" onclick="closeModal()">Закрыть</button>
    </div>
</div>

<script>
    // --- ВСТАВЬ СЮДА СВОЮ ССЫЛКУ ИЗ GOOGLE APPS SCRIPT ---
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXXjSLoclGShalILv99JPSMFTuuXHNVnWaZ2HUIdYRUnL11PGMHqnF461BTzIFRj57qw/exec";

    async function loadData() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            renderDashboard(data);
        } catch(e) { console.error("Ошибка загрузки:", e); }
    }

    function renderDashboard(data) {
        const grid = document.getElementById('grid');
        const podium = document.getElementById('podium');
        grid.innerHTML = ''; podium.innerHTML = '';

        const managers = Object.values(data).sort((a, b) => b.sales - a.sales);

        // Рендер подиума (берем топ-3)
        managers.slice(0, 3).forEach((m, i) => {
            podium.innerHTML += `<div class="podium-item"><div>${['🥇','🥈','🥉'][i]}</div><b>${m.id}</b></div>`;
        });

        // Рендер карточек
        managers.forEach(m => {
            const progress = Math.min(100, (m.sales / m.mega) * 100);
            grid.innerHTML += `
                <div class="card">
                    <h3>${m.id} ${m.isOnline ? '<span class="online-dot"></span>' : ''}</h3>
                    <div style="font-size: 0.9em; color: var(--text-sec)">Выручка</div>
                    <div style="font-size: 1.4em; font-weight: bold; margin-bottom: 5px;">${m.sales.toLocaleString()} ₽</div>
                    <div style="font-size: 0.8em; margin-bottom: 10px;">Средний чек: ${m.avgCheck.toLocaleString()} ₽</div>
                    <div class="progress-bg"><div class="progress-fill" style="width:${progress}%"></div></div>
                    <button class="btn" onclick="openModal('${m.id}')">Личный кабинет</button>
                </div>
            `;
        });
    }

    function openModal(id) {
        document.getElementById('input-m-id').value = id;
        document.getElementById('modal-title').innerText = "Заказ для: " + id;
        document.getElementById('lk-modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('lk-modal').style.display = 'none'; }

    function switchTab(tab) {
        document.getElementById('tab-sales').style.display = tab === 'sales' ? 'block' : 'none';
        document.getElementById('tab-schedule').style.display = tab === 'schedule' ? 'block' : 'none';
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active'));
    }

    async function submitData() {
        const payload = {
            managerId: document.getElementById('input-m-id').value,
            orderId: document.getElementById('input-order').value,
            amount: parseInt(document.getElementById('input-amount').value),
            type: 'Sale'
        };
        
        const btn = event.target;
        btn.innerText = "Отправка...";
        
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
        
        alert('Заказ добавлен!');
        closeModal();
        loadData();
    }

    // Автообновление
    setInterval(loadData, 60000);
    loadData();
</script>
</body>
</html>
